<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- ロゴ -->
  <g transform="translate(80,80)">
    <path d="M22 44 C 22 28, 11 24, 7 16 C 15 18, 21 24, 22 32 C 23 24, 29 18, 37 16 C 33 24, 22 28, 22 44 Z" fill="#10B981"/>
    <path d="M22 44 L 22 26" stroke="#FAFAF7" stroke-width="2.6" stroke-linecap="round"/>
    <text x="50" y="38" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" font-size="22" font-weight="700" fill="#FAFAF7" letter-spacing="0.04em">ハジメル.dev</text>
  </g>

  <!-- メインコピー -->
  <g transform="translate(80,260)">
    <text font-family="'Noto Sans JP',sans-serif" font-size="92" font-weight="700" fill="#FAFAF7" letter-spacing="0.01em">
      <tspan x="0" y="0">挫折しない、を</tspan>
      <tspan x="0" y="120">一緒に。</tspan>
    </text>
    <!-- 手書き風アンダーライン -->
    <path d="M-2 22 Q 200 -10 410 14 T 660 18" stroke="#FF6B6B" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- サブコピー -->
  <g transform="translate(80,540)">
    <text font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="26" font-weight="600" fill="#94A3B8" letter-spacing="0.02em">
      マンツーマンで学ぶ、プログラミングレッスン。
    </text>
  </g>

  <!-- 右上アクセント -->
  <g transform="translate(960,160)" opacity="0.85">
    <rect x="0" y="0" width="180" height="120" rx="14" fill="#0b1226" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="14" cy="14" r="4" fill="#FF6B6B"/>
    <circle cx="28" cy="14" r="4" fill="#FFC94B"/>
    <circle cx="42" cy="14" r="4" fill="#4ADE80"/>
    <text x="14" y="50" font-family="'JetBrains Mono',monospace" font-size="13" fill="#C084FC">function</text>
    <text x="80" y="50" font-family="'JetBrains Mono',monospace" font-size="13" fill="#60A5FA">Welcome</text>
    <text x="14" y="72" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E5E7EB">  return </text>
    <text x="86" y="72" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FB7185">&lt;h1&gt;</text>
    <text x="14" y="94" font-family="'JetBrains Mono',monospace" font-size="13" fill="#FCD34D">    Hello</text>
  </g>
</svg>
